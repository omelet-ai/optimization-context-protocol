[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"
[project]
name = "ocp-foundry-contracts-candidate"
version = "0.0.0+foundry.7547036d1bc9.review1"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "annotated-doc==0.0.4"]
classifiers = ["Private :: Do Not Upload"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
foundry_capability_contract = ["*.json"]
