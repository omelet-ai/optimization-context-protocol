[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ocp-candidate"
version = "0.1.0"
description = "Developer preview of independent optimization interfaces"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
reference = ["ortools==9.15.6755"]
mcp = ["mcp==2.3.0"]
native = ["ocp-foundry-contracts-candidate==0.0.0+foundry.7547036d1bc9.review1", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocp_candidate = ["schemas/*.json", "schema-manifest.json", "profiles.json"]
